[General]
network = simu5g.simulations.nr.networks.Hex7Cell
sim-time-limit = 60s
**.cmdenv-log-level = warn
cmdenv-status-frequency = 5s
**.routingRecorder.enabled = false
output-scalar-file = ../results/phase_bootstrap_normal.sca
output-vector-file = ../results/phase_bootstrap_normal.vec

include ../_topology_include.ini

*.numUe = 12
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "UdpBasicApp"
*.ue[*].app[0].destAddresses = "server"
*.ue[*].app[0].destPort = 1000
*.ue[*].app[0].sendInterval = 50ms
*.ue[*].app[0].messageLength = 1400B

*.ue[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.ue[*].cellularNic.phy.dynamicCellAssociation = true

*.ue[0].mobility.initialX = uniform(500m, 1500m)
*.ue[0].mobility.initialY = uniform(500m, 1500m)
*.ue[1].mobility.initialX = uniform(500m, 1500m)
*.ue[1].mobility.initialY = uniform(500m, 1500m)
*.ue[2].mobility.initialX = uniform(500m, 1500m)
*.ue[2].mobility.initialY = uniform(500m, 1500m)
*.ue[3].mobility.initialX = uniform(500m, 1500m)
*.ue[3].mobility.initialY = uniform(500m, 1500m)
*.ue[4].mobility.initialX = uniform(500m, 1500m)
*.ue[4].mobility.initialY = uniform(500m, 1500m)
*.ue[5].mobility.initialX = uniform(500m, 1500m)
*.ue[5].mobility.initialY = uniform(500m, 1500m)
*.ue[6].mobility.initialX = uniform(500m, 1500m)
*.ue[6].mobility.initialY = uniform(500m, 1500m)
*.ue[7].mobility.initialX = uniform(500m, 1500m)
*.ue[7].mobility.initialY = uniform(500m, 1500m)
*.ue[8].mobility.initialX = uniform(500m, 1500m)
*.ue[8].mobility.initialY = uniform(500m, 1500m)
*.ue[9].mobility.initialX = uniform(500m, 1500m)
*.ue[9].mobility.initialY = uniform(500m, 1500m)
*.ue[10].mobility.initialX = uniform(500m, 1500m)
*.ue[10].mobility.initialY = uniform(500m, 1500m)
*.ue[11].mobility.initialX = uniform(500m, 1500m)
*.ue[11].mobility.initialY = uniform(500m, 1500m)

