[Config Baseline]
network = telcomind.Hex7Cell
sim-time-limit = 10s
cmdenv-express-mode = true
cmdenv-status-frequency = 1s
**.routingRecorder.enabled = false
*.ue[*].app[0].packetReceived*.vector-recording = true
*.ue[*].app[0].endToEndDelay*.vector-recording = true
**.vector-recording = false
**.vector-buffer = 4KiB
**.scalar-recording = true
**.mobility.initFromDisplayString = false
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 2000m
**.mobility.constraintAreaMaxY = 2000m
**.mobility.constraintAreaMaxZ = 0m
*.configurator.config = xmldoc("network.xml")
**.numBands = 50
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = 0
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
*.carrierAggregation.componentCarrier[0].numBands = 50
*.gnb[*].cellularNic.numCarriers = 1
*.gnb[*].cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.ue[*].cellularNic.numCarriers = 1
*.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
**.dynamicCellAssociation = true
**.enableHandover = false
*.ue[*].mobility.typename = "StationaryMobility"
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "UdpSink"
*.ue[*].app[0].localPort = 5000
*.server.app[*].typename = "UdpBasicApp"
*.server.app[*].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 5000
*.server.app[*].messageLength = 1000B
*.server.app[*].sendInterval = 0.01s
*.server.app[*].startTime = 1s
