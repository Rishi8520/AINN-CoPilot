[General]
**.cmdenv-log-level = warn
cmdenv-status-frequency = 5s
network = simu5g.simulations.nr.networks.Hex7Cell
sim-time-limit = 40s
cmdenv-express-mode = false
output-scalar-file = results/phase_02_congestion.sca
output-vector-file = results/phase_02_congestion.vec
**.routingRecorder.enabled = false

include _topology_include.ini

*.gNodeB[*].cellularNic.phy.eNodeBTxPower = 43dBm

# Traffic surge concentrated near gNB1 (id=1, at 1000,1500)
*.numUe = 120
*.ue[*].mobility.initialX = uniform(800m, 1200m)
*.ue[*].mobility.initialY = uniform(1300m, 1700m)

*.ue[*].numApps = 1
*.ue[*].app[0].typename = "UdpBasicApp"
*.ue[*].app[0].destAddresses = "server"
*.ue[*].app[0].destPort = 1000
*.ue[*].app[0].sendInterval = 2ms
*.ue[*].app[0].messageLength = 1400B
