[General]
network = simu5g.simulations.nr.networks.SingleCell_Standalone
sim-time-limit = 20s
output-scalar-file = ${resultdir}/normal_operation.sca
output-vector-file = ${resultdir}/normal_operation.vec
**.routingRecorder.enabled = false

# =======================================================================
# 3GPP TR 38.901 Physical Layer & Channel Modeling (Band n78)
# =======================================================================
**.carrierFrequency = 3.5GHz
**.numerologyIndex = 1                  # 30 kHz SCS (Standard for Sub-6GHz eMBB)
**.mac.numBands = 106                   # 106 PRBs (approx 40MHz bandwidth)
**.cellularNic.channelModel[0].scenario = "URBAN_MACROCELL"
**.cellularNic.channelModel[0].nodebHeight = 25m
**.cellularNic.channelModel[0].ueHeight = 1.5m
**.cellularNic.phy.enableAMC = true     # Adaptive Modulation and Coding
**.cellularNic.phy.harqProcesses = 16   # 3GPP Standard HARQ

# =======================================================================
# gNodeB Configuration (O-RAN Radio Unit mapping)
# =======================================================================
*.gNodeB.macCellId = 1
*.gNodeB.macNodeId = 1
*.gNodeB.cellularNic.phy.txPower = 43dBm # 20W Standard Macro Cell TX Power
**.mac.schedulingDisciplineDl = "PF"     # Proportional Fair Scheduler
**.mac.schedulingDisciplineUl = "PF"

# =======================================================================
# UE & Traffic Configuration (Realistic Video Streaming / eMBB)
# =======================================================================
*.numUe = ${ue_count=10}
*.ue[*].macCellId = 1
*.ue[*].masterId = 1

# Traffic: Simulated 4K Video Streaming (CBR over UDP)
*.ue[*].app[0].typename = "UdpBasicApp"
*.ue[*].app[0].destAddresses = "server"
*.ue[*].app[0].destPort = 1000
*.ue[*].app[0].sendInterval = 2ms       # High density packet generation
*.ue[*].app[0].packetLength = 1400B     # Standard MTU-aligned payload

# Mobility: Pedestrian Urban Walkway
*.ue[*].mobility.typename = "RandomWaypointMobility"
*.ue[*].mobility.speed = uniform(1mps, 3mps)
*.ue[*].mobility.x = uniform(50m, 250m)
*.ue[*].mobility.y = uniform(50m, 250m)
