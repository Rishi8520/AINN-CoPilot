# Shared 7-gNB hexagonal topology, included by every phase .ini
# Adapted from Simu5G's own working nr/standalone_multicell example.

*.numGnb = 7

**.mobility.initFromDisplayString = false
**.mobility.constraintAreaMaxX = 2000m
**.mobility.constraintAreaMaxY = 2000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m

*.gNodeB[0].mobility.initialX = 1000m
*.gNodeB[0].mobility.initialY = 1000m
*.gNodeB[1].mobility.initialX = 1000m
*.gNodeB[1].mobility.initialY = 1500m
*.gNodeB[2].mobility.initialX = 1433m
*.gNodeB[2].mobility.initialY = 1250m
*.gNodeB[3].mobility.initialX = 1433m
*.gNodeB[3].mobility.initialY = 750m
*.gNodeB[4].mobility.initialX = 1000m
*.gNodeB[4].mobility.initialY = 500m
*.gNodeB[5].mobility.initialX = 567m
*.gNodeB[5].mobility.initialY = 750m
*.gNodeB[6].mobility.initialX = 567m
*.gNodeB[6].mobility.initialY = 1250m

# Carrier aggregation: every gNB and every UE must bind to the SAME
# component carrier module. This was missing before and is the
# most likely real cause of the cellInfo NULL pointer crash.
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 50

*.gNodeB[*].cellularNic.numCarriers = 1
*.gNodeB[*].cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.gNodeB[*].cellularNic.channelModel[0].scenario = "URBAN_MACROCELL"

*.ue[*].cellularNic.numCarriers = 1
*.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

# UE cell attachment: dynamic (best-power) association.
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
**.dynamicCellAssociation = true

# UEs are stationary within each phase, so no live handover needed —
# this avoids requiring X2App per-pair application-layer wiring.
**.enableHandover = false
