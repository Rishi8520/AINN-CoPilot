[General]
network = simu5g.simulations.nr.networks.MultiCell_Standalone
sim-time-limit = 10s
output-scalar-file = results/${configname}-${runnumber}.sca
output-vector-file = results/${configname}-${runnumber}.vec
**.routingRecorder.enabled = false

# ==========================================================
# 3GPP Physical Layer & Channel Modeling (Band n78)
# ==========================================================
**.carrierFrequency = 3.5GHz
**.numerologyIndex = 1              # 30 kHz Subcarrier Spacing (SCS)
**.mac.numBands = 50                # 50 Resource Blocks (RBs)
**.cellularNic.channelModel[0].scenario = "URBAN_MACROCELL"

# Node Placement
*.numGnb = 2
*.gNodeB[0].mobility.initialX = 250m
*.gNodeB[0].mobility.initialY = 250m
*.gNodeB[1].mobility.initialX = 750m
*.gNodeB[1].mobility.initialY = 250m
*.numUe = ${ue_count=10}

# Standard eMBB Traffic (UDP Application)
*.ue[*].app[0].typename = "UdpBasicApp"
*.ue[*].app[0].destAddresses = "server"
*.ue[*].app[0].destPort = 1000
*.ue[*].app[0].sendInterval = 5ms
*.ue[*].app[0].packetLength = 1000B

# ==========================================================
# SCENARIO 1: Normal Operation (Stable eMBB)
# ==========================================================
[Config normal_operation]
description = "Baseline 5G NR setup with successful handovers"
*.ue[*].mobility.typename = "LinearMobility"
*.ue[*].mobility.speed = 3mps       # Pedestrian speed (~10 km/h)
*.ue[*].mobility.initialX = 400m
*.ue[*].mobility.initialY = 250m
*.ue[*].mobility.angle = 0deg       # Moving towards gNodeB 1
*.gNodeB[*].cellularNic.phy.txPower = 40dBm # Strong transmit power

# ==========================================================
# SCENARIO 2: Handover Failure (High Mobility & Interference)
# ==========================================================
[Config handover_failure]
description = "Simulating Radio Link Failure due to high speed and X2 delay"
*.ue[*].mobility.typename = "LinearMobility"
*.ue[*].mobility.speed = 33mps      # Highway speed (~120 km/h)
*.ue[*].mobility.initialX = 450m
*.ue[*].mobility.initialY = 250m
*.ue[*].mobility.angle = 0deg       
# Induce failure via weak coverage overlap and X2 communication delay
*.gNodeB[*].cellularNic.phy.txPower = 20dBm 
**.x2App[*].handoverLatency = 500ms 

# ==========================================================
# SCENARIO 3: Energy Optimization (O-RAN Sleep States)
# ==========================================================
[Config energy_optimization]
description = "Energy saving via Tx Power reduction and active RB limiting"
*.ue[*].mobility.typename = "StationaryMobility"
*.ue[*].mobility.initialX = 300m
*.ue[*].mobility.initialY = 250m
# Apply Energy Optimization intents
*.gNodeB[*].cellularNic.phy.txPower = 26dBm 
**.mac.numBands = 20                # Reduce active bandwidth to save power
