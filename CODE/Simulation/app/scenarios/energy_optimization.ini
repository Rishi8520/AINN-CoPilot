[General]
network = simu5g.simulations.nr.networks.SingleCell_Standalone
sim-time-limit = 20s
output-scalar-file = ${resultdir}/energy_optimization.sca
output-vector-file = ${resultdir}/energy_optimization.vec
**.routingRecorder.enabled = false

# =======================================================================
# 3GPP Physical Layer (O-RAN Energy Saving State)
# =======================================================================
**.carrierFrequency = 3.5GHz
**.numerologyIndex = 1
**.cellularNic.channelModel[0].scenario = "URBAN_MACROCELL"

# =======================================================================
# Energy Optimization Execution Parameters
# =======================================================================
# 1. Drastic Tx Power Reduction (Simulating off-peak cell dimming)
*.gNodeB.cellularNic.phy.txPower = 20dBm # Dropped from 43dBm to 20dBm

# 2. Bandwidth Part (BWP) Reduction / Resource Block Limiting
**.mac.numBands = 15                     # Drastically reduced active PRBs

# 3. Aggressive Modulation Restriction (Focus on reliability over speed)
**.cellularNic.phy.enableAMC = false
**.cellularNic.phy.fixedMcsDl = 4        # QPSK, low spectral efficiency, robust
**.cellularNic.phy.fixedMcsUl = 4

# =======================================================================
# UE & Bursty Traffic (Allows micro-sleep states)
# =======================================================================
*.numUe = ${ue_count=10}
*.ue[*].mobility.typename = "StationaryMobility"
*.ue[*].mobility.initialX = uniform(100m, 150m)
*.ue[*].mobility.initialY = uniform(100m, 150m)

# IoT / Background sync traffic pattern (Bursty, non-continuous)
*.ue[*].app[0].typename = "UdpBasicApp"
*.ue[*].app[0].destAddresses = "server"
*.ue[*].app[0].destPort = 1000
*.ue[*].app[0].sendInterval = exponential(50ms) # Randomized bursty traffic
*.ue[*].app[0].packetLength = 512B
