[General]
network = simu5g.simulations.nr.networks.MultiCell_Standalone

sim-time-limit = 300s

output-scalar-file = results/energy_optimization.sca
output-vector-file = results/energy_optimization.vec

**.routingRecorder.enabled = false

#################################################
# Same Digital Twin
#################################################

*.numGnb = 7

*.gNodeB[0].mobility.initialX = 500m
*.gNodeB[0].mobility.initialY = 500m

*.gNodeB[1].mobility.initialX = 1000m
*.gNodeB[1].mobility.initialY = 500m

*.gNodeB[2].mobility.initialX = 1500m
*.gNodeB[2].mobility.initialY = 500m

*.gNodeB[3].mobility.initialX = 500m
*.gNodeB[3].mobility.initialY = 1000m

*.gNodeB[4].mobility.initialX = 1000m
*.gNodeB[4].mobility.initialY = 1000m

*.gNodeB[5].mobility.initialX = 1500m
*.gNodeB[5].mobility.initialY = 1000m

*.gNodeB[6].mobility.initialX = 1000m
*.gNodeB[6].mobility.initialY = 1500m

#################################################
# Energy Saving State
#################################################

**.carrierFrequency = 3.5GHz
**.numerologyIndex = 1

**.cellularNic.channelModel[0].scenario = "URBAN_MACROCELL"

*.gNodeB[*].cellularNic.phy.eNodeBTxPower = 25dBm

#################################################
# Reduced Load
#################################################

*.numUe = 20

*.ue[*].mobility.initialX = uniform(0m,2000m)
*.ue[*].mobility.initialY = uniform(0m,2000m)

#################################################
# Bursty IoT Style Traffic
#################################################

*.ue[*].numApps = 1

*.ue[*].app[0].typename = "UdpBasicApp"
*.ue[*].app[0].destAddresses = "server"
*.ue[*].app[0].destPort = 1000

*.ue[*].app[0].sendInterval = exponential(1s)

*.ue[*].app[0].messageLength = 256B