[General]
network = simu5g.simulations.nr.networks.Hex7Cell
sim-time-limit = 52s
**.cmdenv-log-level = warn
cmdenv-status-frequency = 5s
**.routingRecorder.enabled = false
output-scalar-file = ../results/phase_monitor_323.sca
output-vector-file = ../results/phase_monitor_323.vec

include ../_topology_include.ini

*.numUe = 22
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "UdpBasicApp"
*.ue[*].app[0].destAddresses = "server"
*.ue[*].app[0].destPort = 1000
*.ue[*].app[0].sendInterval = 50ms
*.ue[*].app[0].messageLength = 1400B

*.ue[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.ue[*].cellularNic.phy.dynamicCellAssociation = true

*.ue[0].mobility.initialX = uniform(500m, 1500m)
