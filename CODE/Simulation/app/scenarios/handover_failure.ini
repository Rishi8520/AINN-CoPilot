[General]
network = simu5g.simulations.nr.networks.MultiCell_Standalone
sim-time-limit = 20s
output-scalar-file = ${resultdir}/handover_failure.sca
output-vector-file = ${resultdir}/handover_failure.vec
**.routingRecorder.enabled = false

# =======================================================================
# Multi-Cell Network Topology & Channel
# =======================================================================
**.carrierFrequency = 2.1GHz            # Band n1 for coverage
**.numerologyIndex = 0                  # 15 kHz SCS for broader coverage
**.mac.numBands = 52                    # 10MHz bandwidth
**.cellularNic.channelModel[0].scenario = "RURAL_MACROCELL"

*.numGnb = 2
*.gNodeB[0].mobility.initialX = 100m
*.gNodeB[0].mobility.initialY = 300m
*.gNodeB[1].mobility.initialX = 900m
*.gNodeB[1].mobility.initialY = 300m

# =======================================================================
# Intentional Degradation for Handover Failure Diagnostics
# =======================================================================
# 1. Weak overlapping coverage zone
*.gNodeB[*].cellularNic.phy.txPower = 30dBm 

# 2. X2 Interface Latency (Simulating backhaul congestion)
**.x2App[*].handoverLatency = 150ms     # Unacceptably high for fast handovers

# 3. Misconfigured Handover Event A3 Thresholds
**.handoverMeasurement.filterCoefficient = 40  # Sluggish measurement filtering
**.handoverMeasurement.a3Offset = 6dB          # Too high, triggers late

# =======================================================================
# UE Mobility: Highway Speed Crossing Cell Boundary
# =======================================================================
*.numUe = ${ue_count=5}
*.ue[*].mobility.typename = "LinearMobility"
*.ue[*].mobility.speed = 33mps          # ~120 km/h
*.ue[*].mobility.initialX = 150m        # Start at gNB-0
*.ue[*].mobility.initialY = 300m
*.ue[*].mobility.angle = 0deg           # Drive straight toward gNB-1

# Standard Traffic to measure drop rate
*.ue[*].app[0].typename = "UdpBasicApp"
*.ue[*].app[0].destAddresses = "server"
*.ue[*].app[0].destPort = 1000
*.ue[*].app[0].sendInterval = 10ms
*.ue[*].app[0].packetLength = 1000B
