[General]
network = simu5g.simulations.nr.networks.MultiCell_Standalone

sim-time-limit = 300s

output-scalar-file = results/handover_failure.sca
output-vector-file = results/handover_failure.vec

**.routingRecorder.enabled = false

#################################################
# Sparse Coverage Layout
#################################################

*.numGnb = 3

*.gNodeB[0].mobility.initialX = 0m
*.gNodeB[0].mobility.initialY = 500m

*.gNodeB[1].mobility.initialX = 1200m
*.gNodeB[1].mobility.initialY = 500m

*.gNodeB[2].mobility.initialX = 2400m
*.gNodeB[2].mobility.initialY = 500m

#################################################
# Coverage Degradation
#################################################

**.carrierFrequency = 2.1GHz
**.numerologyIndex = 0

**.cellularNic.channelModel[0].scenario = "RURAL_MACROCELL"

*.gNodeB[*].cellularNic.phy.eNodeBTxPower = 28dBm

*.gNodeB[*].cellularNic.phy.handoverLatency = 300ms

#################################################
# High Speed Users
#################################################

*.numUe = 15

*.ue[*].mobility.typename = "LinearMobility"

*.ue[*].mobility.initialX = 50m
*.ue[*].mobility.initialY = uniform(450m,550m)

*.ue[*].mobility.speed = 35mps

*.ue[*].mobility.angle = 0deg

#################################################
# Continuous Traffic
#################################################

*.ue[*].numApps = 1

*.ue[*].app[0].typename = "UdpBasicApp"

*.ue[*].app[0].destAddresses = "server"

*.ue[*].app[0].destPort = 1000

*.ue[*].app[0].sendInterval = 5ms

*.ue[*].app[0].messageLength = 1400B