[General]
**.cmdenv-log-level = warn
cmdenv-status-frequency = 5s
network = simu5g.simulations.nr.networks.Hex7Cell
sim-time-limit = 40s
cmdenv-express-mode = false
output-scalar-file = results/phase_04_power_instability.sca
output-vector-file = results/phase_04_power_instability.vec
**.routingRecorder.enabled = false

include _topology_include.ini


*.gNodeB[*].cellularNic.phy.eNodeBTxPower = 43dBm
# gNB3 (id=3, at 1433,750) experiencing power instability -> reduced tx power
*.gNodeB[3].cellularNic.phy.eNodeBTxPower = 15dBm

*.numUe = 60
*.ue[*].mobility.initialX = uniform(1200m, 1700m)
*.ue[*].mobility.initialY = uniform(500m, 1000m)

*.ue[*].numApps = 1
*.ue[*].app[0].typename = "UdpBasicApp"
*.ue[*].app[0].destAddresses = "server"
*.ue[*].app[0].destPort = 1000
*.ue[*].app[0].sendInterval = 5ms
*.ue[*].app[0].messageLength = 1400B
