services:
  telcomind-backend:
    image: telcomind-simulation-backend:latest
    build:
      context: ..
      dockerfile: Simulation/Dockerfile
    container_name: telcomind-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 7000
    ports:
      - "7000:7000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ainn-net

networks:
  ainn-net:
    driver: bridge