services:
  rag-service:
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: telcomind-rag
    ports:
      - "${RAG_PORT:-7001}:7001"
    environment:
      CHROMA_DIR: /data/chroma
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      COLLECTION_NAME: ${COLLECTION_NAME:-telcomind_knowledge}
      TOP_K: ${TOP_K:-8}
      RERANK_TOP_K: ${RERANK_TOP_K:-4}
      RAG_DEVICE: ${RAG_DEVICE:-auto}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8080}
      LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-http://vllm:8080}
    volumes:
      - ./knowledge_base:/app/knowledge_base
      - ./storage/chroma:/data/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7001/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  vllm:
    image: vllm/vllm-openai:latest
    container_name: telcomind-vllm
    ports:
      - "${VLLM_PORT:-8080}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.88"
      - --max-model-len
      - "8192"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
