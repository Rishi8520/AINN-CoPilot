services:
  rag-service:
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: telcomind-rag
    ports:
      - "${RAG_PORT:-7001}:7001"
    environment:
      RAG_PROFILE: ${RAG_PROFILE:-quickstart}
      RAG_QUICKSTART_CORPUS_PATH: ${RAG_QUICKSTART_CORPUS_PATH:-quickstart/corpus.jsonl}
      RAG_QUICKSTART_TOP_K: ${RAG_QUICKSTART_TOP_K:-5}
      RAG_FULL_INDEX_PATH: ${RAG_FULL_INDEX_PATH:-/data/chroma}
      RAG_AUTO_INGEST: ${RAG_AUTO_INGEST:-false}
      RAG_STRICT_PROVENANCE: ${RAG_STRICT_PROVENANCE:-true}
      CHROMA_DIR: ${CHROMA_DIR:-/data/chroma}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      COLLECTION_NAME: ${COLLECTION_NAME:-telcomind_knowledge}
      TOP_K: ${TOP_K:-5}
      RERANK_TOP_K: ${RERANK_TOP_K:-4}
      RAG_DEVICE: ${RAG_DEVICE:-cpu}
      RAG_SYNTHESIS_BACKEND: ${RAG_SYNTHESIS_BACKEND:-deterministic}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_REQUIRED: ${LLM_REQUIRED:-false}
      LLM_FALLBACK_TO_DETERMINISTIC: ${LLM_FALLBACK_TO_DETERMINISTIC:-true}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-3}
      LLM_READ_TIMEOUT_SECONDS: ${LLM_READ_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-}
    volumes:
      - ./knowledge_base:/app/knowledge_base
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7001/ready"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
