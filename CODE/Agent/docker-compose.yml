# ─────────────────────────────────────────────────────────────────
# AINN-CoPilot — Master Docker Compose
# Run from CODE/Agent/ directory:
#   docker compose --env-file ../. env up -d
#
# Service dependency order:
#   redis → rag-retrieval → ainn-agent → ainn-ui
#   simulation (independent, no deps)
# ─────────────────────────────────────────────────────────────────

version: "3.9"

networks:
  ainn-net:
    driver: bridge

services:

  # ── Member 1: Simulation Service ────────────────────────────────
  # Built from Member 1's Dockerfile in CODE/simulation/
  # Exposes a FastAPI REST endpoint at /simulate
  simulation:
    build:
      context: ../simulation
      dockerfile: Dockerfile
    container_name: ainn-simulation
    ports:
      - "8888:8888"
    networks:
      - ainn-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s    # OMNeT++ takes time to initialise

  # ── Member 2: Redis Vector Database ─────────────────────────────
  redis-vector-db:
    image: redis/redis-stack:7.2.0-v9
    container_name: ainn-redis
    ports:
      - "6379:6379"
      - "8001:8001"        # Redis Insight UI (useful for debugging)
    networks:
      - ainn-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Member 2: TEI Embedding Service ─────────────────────────────
  tei-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: ainn-embedding
    ports:
      - "6006:80"
    environment:
      - MODEL_ID=BAAI/bge-base-en-v1.5
    networks:
      - ainn-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Member 2: TEI Reranker Service ──────────────────────────────
  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: ainn-reranker
    ports:
      - "8808:80"
    environment:
      - MODEL_ID=BAAI/bge-reranker-base
    networks:
      - ainn-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Member 2: RAG Retrieval Microservice ────────────────────────
  # Official OPEA retriever image talking to Redis
  rag-retrieval:
    image: opea/retriever:latest
    container_name: ainn-retrieval
    ports:
      - "8889:7000"
    environment:
      REDIS_URL: redis://redis-vector-db:6379
      INDEX_NAME: ${INDEX_NAME:-ainn_3gpp}
      TEI_EMBEDDING_ENDPOINT: http://tei-embedding:6006
      RERANK_ENDPOINT: http://tei-reranker:8808
      LOGFLAG: "True"
    networks:
      - ainn-net
    depends_on:
      redis-vector-db:
        condition: service_healthy
      tei-embedding:
        condition: service_healthy
    restart: unless-stopped

  # ── You: OPEA Agent Microservice ────────────────────────────────
  # Official OPEA agent image with your tools mounted in
  ainn-agent:
    image: opea/agent:latest
    container_name: ainn-agent
    ports:
      - "${AGENT_PORT:-9090}:9090"
    volumes:
      # Mount your tools directory into the container's expected path
      - ./tools:/home/user/comps/agent/src/tools
    environment:
      HUGGINGFACEHUB_API_TOKEN: ${HF_TOKEN}
      model: ${LLM_MODEL:-meta-llama/Meta-Llama-3-8B-Instruct}
      ip_address: ${HOST_IP}
      strategy: ${AGENT_STRATEGY:-react_llama}
      with_memory: ${WITH_MEMORY:-true}
      # LLM runs on Member 2's machine — point to their IP
      llm_endpoint_url: ${LLM_ENDPOINT_URL}
      llm_engine: vllm
      recursion_limit: ${RECURSION_LIMIT:-15}
      require_human_feedback: "false"
      tools: /home/user/comps/agent/src/tools/ainn_tools.yaml
      # These are read by tools.py inside the container
      # Inside Docker, services talk by container name, not localhost
      SIM_SERVICE_URL: http://simulation:8888
      RAG_SERVICE_URL: http://rag-retrieval:7000
    networks:
      - ainn-net
    depends_on:
      simulation:
        condition: service_healthy
      rag-retrieval:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s    # agent needs time to load tools on startup

  # ── You: Streamlit UI ───────────────────────────────────────────
  ainn-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ainn-ui
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      AGENT_URL: http://ainn-agent:9090
    networks:
      - ainn-net
    depends_on:
      ainn-agent:
        condition: service_healthy
    restart: unless-stopped