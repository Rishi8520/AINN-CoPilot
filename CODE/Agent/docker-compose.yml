networks:
  ainn-net:
    driver: bridge

services:
  ainn-agent:
    ipc: host
    image: opea/agent:latest
    container_name: ainn-agent
    ports:
      - "${AGENT_PORT:-9090}:9090"
    volumes:
      - ./tools:/home/user/comps/agent/src/tools
    environment:
      #HUGGINGFACEHUB_API_TOKEN: ${HF_TOKEN}
      model: ${LLM_MODEL:-meta-llama/Meta-Llama-3-8B-Instruct}
      ip_address: ${HOST_IP:-0.0.0.0}
      memory_type: "checkpointer"
      strategy: ${AGENT_STRATEGY:-react_llama}
      with_memory: ${WITH_MEMORY:-true}
      llm_endpoint_url: ${LLM_ENDPOINT_URL}
      llm_engine: ${LLM_ENGINE:-vllm}
      max_new_tokens: ${MAX_NEW_TOKENS:-256}
      recursion_limit: ${RECURSION_LIMIT:-15}
      require_human_feedback: "false"
      tools: /home/user/comps/agent/src/tools/ainn_tools.yaml
      SIM_SERVICE_URL: ${SIM_SERVICE_URL}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL}
    networks:
      - ainn-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9090/v1/health_check', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  ainn-gateway:
    build:
      context: ..
      dockerfile: Agent/Dockerfile.gateway
    container_name: ainn-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8888"
    environment:
      AGENT_ENDPOINT: http://ainn-agent:9090
      GATEWAY_PORT: 8888

      SIM_SERVICE_URL: ${SIM_SERVICE_URL}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL}

      SIM_HEALTH_PATH: ${SIM_HEALTH_PATH:-/status}
      RAG_HEALTH_PATH: ${RAG_HEALTH_PATH:-/health}
      AGENT_HEALTH_PATH: ${AGENT_HEALTH_PATH:-/v1/health_check}
      HEALTH_PROBE_TIMEOUT_SECONDS: ${HEALTH_PROBE_TIMEOUT_SECONDS:-2}
      STARTUP_PROBE_RETRIES: ${STARTUP_PROBE_RETRIES:-1}
      STARTUP_PROBE_DELAY_SECONDS: ${STARTUP_PROBE_DELAY_SECONDS:-1}
    networks:
      - ainn-net
    depends_on:
      ainn-agent:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/v1/health', timeout=5)\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  ainn-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ainn-ui
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      GATEWAY_URL: http://ainn-gateway:8888
    networks:
      - ainn-net
    depends_on:
      ainn-gateway:
        condition: service_healthy
    restart: unless-stopped
