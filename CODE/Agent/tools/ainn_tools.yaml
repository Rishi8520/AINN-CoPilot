# ─────────────────────────────────────────────────────────────────
# AINN-CoPilot Tool Registry
# This file is mounted into the OPEA agent container and tells the
# agent what tools exist, when to use them, and how to call them.
#
# Mount path inside container: /home/user/comps/agent/src/tools/
# Activated by env var:        tools=/home/user/comps/agent/src/tools/ainn_tools.yaml
#
# The 'description' field is READ BY THE LLM — write it as if you
# are instructing a smart but literal assistant. Be specific.
# ─────────────────────────────────────────────────────────────────

run_simulation:
  description: >
    Request Simulation service KPIs for a specific scenario and return the
    structured Simulation API response. Use this tool when the operator reports a performance
    issue (throughput drop, high latency, packet loss, excessive handovers,
    interference) and you need quantitative data to confirm a hypothesis.
    Also use this when asked to compare network behaviour across different
    load or interference conditions.

    Available scenario labels:
      - normal_operation: stable baseline 5G NR operation
      - handover_failure: high mobility / weak overlap / delayed handover stress
      - energy_optimization: reduced transmit power and resource usage
      - hotspot_traffic_burst: high-load or interference-like hotspot stress, if supported

    Friendly aliases are also accepted by the Python tool:
      - baseline -> normal_operation
      - handover_stress -> handover_failure
      - energy_saving -> energy_optimization
      - high_load -> hotspot_traffic_burst
      - interference_high -> hotspot_traffic_burst
  pip_dependencies: requests,python-dotenv
  callable_api: tools.py:call_simulation
  args_schema:
    scenario:
      type: str
      description: >
        The simulation scenario to run. Prefer one of:
        normal_operation, handover_failure, energy_optimization.
        The tool also accepts aliases such as baseline, handover_stress,
        energy_saving, high_load, and interference_high.
    ue_count:
      type: int
      description: >
        Number of User Equipment (UEs) to simulate. Integer between 1 and 100.
        Use 20 if the operator does not specify. Use higher values (50-100)
        for capacity or high_load scenarios.
    cell_id:
      type: int
      description: >
        The cell identifier the operator is asking about. Use 0 if unknown
        or if the operator does not specify a cell number.
    slice_type:
      type: str
      description: >
          Network slice type. Use eMBB by default. Use URLLC for low-latency
          reliability scenarios. Use mMTC for IoT or background traffic scenarios.
  return_output: simulation_kpis


rag_retrieve:
  description: >
    Retrieve technical knowledge from the 3GPP and O-RAN specification corpus.
    Use this tool when you need standards-based grounding for a diagnosis,
    when the operator asks about protocols or procedures, when you need
    remediation steps backed by specifications, or when you need to explain
    why a particular network behaviour is occurring according to standards.
    Do NOT use this for live network KPI data — use run_simulation for that.
  pip_dependencies: requests,python-dotenv
  callable_api: tools.py:call_rag
  args_schema:
    query:
      type: str
      description: >
        A precise technical question to search the knowledge base.
        Frame it as a specific question, not a vague keyword.
        Good: "What are the recommended remediation steps for co-channel
        interference in 5G NR according to O-RAN specifications?"
        Bad: "interference"
  return_output: structured_retrieval_context
